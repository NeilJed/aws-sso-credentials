[project]
name = "aws-sso-credentials"
version = "1.1.0"
description = "Retrieves AWS credentials from SSO for use with CLI/Boto3 apps."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.12.6",
    "questionary>=2.0.1",
]

[project.scripts]
awssso = "awssso.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/awssso"]

[tool.ruff]
target-version = "py311"
line-length = 120

[dependency-groups]
dev = [
    "ruff",
    "pytest",
]
